name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate metadata files
        run: |
          python3 -m json.tool server.json > /dev/null
          python3 -m json.tool glama.json > /dev/null
          python3 - <<'EOF'
          import json
          s = json.load(open('server.json'))
          assert s['name'] == 'io.github.boriskendev/stormap', s['name']
          assert len(s['description']) <= 100, 'registry description must be 100 characters or fewer'
          assert any(r['url'] == 'https://stormap.ai/mcp' for r in s['remotes'])
          print('server.json OK, version', s['version'])
          EOF

      - name: Build the Docker image
        run: docker build -t stormap-mcp .

      - name: Hosted server answers and lists its tools
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"stormap-mcp-ci","version":"1.0"}}}'
          list='{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          hdr=(-H 'content-type: application/json' -H 'accept: application/json, text/event-stream')
          curl -fsS "${hdr[@]}" -d "$init" https://stormap.ai/mcp > init.txt
          grep -q '"serverInfo"' init.txt
          curl -fsS "${hdr[@]}" -d "$list" https://stormap.ai/mcp > tools.txt
          for t in package_check check_before_paying find_best_api read_url; do
            grep -q "\"$t\"" tools.txt || { echo "missing tool $t"; exit 1; }
          done
          echo "tools/list OK"
